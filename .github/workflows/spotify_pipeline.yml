name: Spotify Pipeline

on:
  push:
    branches: [main, automation]
  pull_request:
    branches: [main, automation]
  workflow_dispatch:

jobs:
  automation:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le repository
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les dependances
        run: pip install pandas scikit-learn

      - name: Nettoyer les donnees
        run: python data_exam.py

      - name: Entrainement du modele ML
        run: python ml_popularity.py

      - name: Verifier les fichiers generes
        run: |
          test -f data/spotify_clean.csv
          test -f data/ml_feature_importance.csv
          test -f data/ml_metrics.csv
          echo "Tous les fichiers ont ete generes avec succes."

      - name: Sauvegarder les resultats
        uses: actions/upload-artifact@v4
        with:
          name: spotify-pipeline-results
          path: |
            data/spotify_clean.csv
            data/ml_feature_importance.csv
            data/ml_metrics.csv
